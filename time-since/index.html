<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Since...</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 flex flex-col items-center">

  <main class="w-full max-w-xl space-y-6">
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold tracking-tight">Time Since...</h1>
      <p class="text-sm text-slate-400">Track how long it has been since key milestones.</p>
    </header>

    <!-- Entry Form -->
    <form id="tracker-form" class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
      <div>
        <label for="event-title" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Event Name</label>
        <input 
          id="event-title" 
          type="text" 
          placeholder="e.g., Graduated college, Quit nicotine, Saw Mom" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500"
        />
      </div>
      <div>
        <label for="event-datetime" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Date & Time</label>
        <input 
          id="event-datetime" 
          type="datetime-local" 
          required 
          class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500 text-slate-200"
        />
      </div>
      <button 
        type="submit" 
        class="w-full bg-cyan-600 hover:bg-cyan-500 font-medium py-2 rounded-lg text-sm transition-colors text-white"
      >
        Track Event
      </button>
    </form>

    <!-- Cards Container -->
    <div id="events-container" class="space-y-3"></div>
  </main>

  <script>
    const form = document.getElementById('tracker-form');
    const titleInput = document.getElementById('event-title');
    const datetimeInput = document.getElementById('event-datetime');
    const container = document.getElementById('events-container');

    // Load persisted data
    let events = JSON.parse(localStorage.getItem('time_since_events') || '[]');

    function saveEvents() {
      localStorage.setItem('time_since_events', JSON.stringify(events));
    }

    function calculateTimeDifference(targetTimestamp) {
      const now = new Date().getTime();
      const diff = Math.max(0, now - targetTimestamp);

      const seconds = Math.floor((diff / 1000) % 60);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));

      return { days, hours, minutes, seconds };
    }

    function render() {
      if (events.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 border border-dashed border-slate-800 rounded-xl text-slate-500 text-sm">
            No events tracked yet. Add one above.
          </div>
        `;
        return;
      }

      container.innerHTML = events.map((ev, index) => {
        const { days, hours, minutes, seconds } = calculateTimeDifference(ev.timestamp);
        const dateString = new Date(ev.timestamp).toLocaleDateString(undefined, { 
          year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
        });

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
            <div>
              <div class="font-semibold text-base text-slate-100">${escapeHtml(ev.title)}</div>
              <div class="text-xs text-slate-500 mb-2">${dateString}</div>
              <div class="flex items-baseline space-x-2 font-mono text-cyan-400">
                <span class="text-2xl font-bold">${days}</span><span class="text-xs text-slate-400 uppercase">d</span>
                <span class="text-2xl font-bold">${hours}</span><span class="text-xs text-slate-400 uppercase">h</span>
                <span class="text-2xl font-bold">${minutes}</span><span class="text-xs text-slate-400 uppercase">m</span>
                <span class="text-lg text-slate-400">${seconds}</span><span class="text-xs text-slate-400 uppercase">s</span>
              </div>
            </div>
            <button 
              onclick="removeEvent(${index})" 
              class="text-slate-500 hover:text-rose-400 p-2 text-sm transition-colors"
              title="Delete event"
            >
              ✕
            </button>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.removeEvent = function(index) {
      events.splice(index, 1);
      saveEvents();
      render();
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const dateVal = datetimeInput.value;
      if (!title || !dateVal) return;

      const timestamp = new Date(dateVal).getTime();
      events.unshift({ title, timestamp });
      saveEvents();
      render();

      form.reset();
    });

    // Initial render and live ticker update
    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
