<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanderlog • Travel Bucket List</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --text:#f1e9d2; --mute:#94a3b8; --visit:#22c55e; --wish:#f59e0b; --none:#334155; --gold:#f59e0b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header { border-bottom-color:var(--gold); }
  header h1, h2, .big, .modal-box h2 { font-family:Georgia,'Times New Roman',serif; }
  header h1 { font-size:18px; margin:0 12px 0 0; color:var(--gold); letter-spacing:.04em; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  button { font:inherit; color:var(--text); background:#1d2744; border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button:hover { background:#27345c; }
  nav button.active { background:var(--gold); border-color:var(--gold); color:#0f172a; font-weight:600; }
  .spacer { flex:1; }
  .page { display:none; height:calc(100vh - 56px); position:relative; }
  .page.active { display:block; }
  .scroll { overflow:auto; padding:20px; }
  #leafletEl { width:100%; height:100%; }
  .hud { position:absolute; top:12px; left:12px; z-index:500; background:rgba(20,27,48,.88); border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-width:200px; backdrop-filter:blur(6px); }
  .hud h3 { margin:0 0 6px; font-size:14px; }
  .hud .row { display:flex; justify-content:space-between; gap:16px; color:var(--mute); }
  .hud .row b { color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .card h4 { margin:0 0 2px; font-size:14px; }
  .card p { margin:0 0 8px; color:var(--mute); font-size:13px; }
  .bar { height:6px; background:#222c49; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--wish); }
  .done .bar i { background:var(--visit); }
  .done { border-color:var(--visit); }
  .locked { opacity:.5; }
  .tag { font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid currentColor; }
  .common { color:#94a3b8; } .uncommon { color:#38bdf8; } .rare { color:#c084fc; }
  h2 { margin:24px 0 10px; font-size:16px; }
  h2:first-child { margin-top:0; }
  .passport { display:grid; grid-template-columns:minmax(260px,340px) 1fr; gap:16px; margin-bottom:8px; }
  @media (max-width:760px) { .passport { grid-template-columns:1fr; } }
  .big { font-size:28px; font-weight:700; }
  .leaflet-container { background:#05070d; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--panel); color:var(--text); }
  .popbtns { display:flex; gap:6px; margin-top:6px; }
  .popbtns button { padding:3px 8px; font-size:12px; }
  .modal { display:none; position:fixed; inset:0; z-index:2000; align-items:center; justify-content:center; background:rgba(5,7,13,.8); }
  .modal.open { display:flex; }
  .modal-box { max-width:420px; margin:16px; padding:28px; text-align:center; background:var(--panel); border:2px solid var(--gold); border-radius:14px; }
  .modal-box h2 { margin:0 0 18px; font-size:20px; color:var(--gold); }
  .btn-gold { background:var(--gold); border-color:var(--gold); color:#0f172a; font-weight:600; }
  .btn-gold:hover { background:#fbbf24; }
  .banner { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:1000; padding:8px 18px; background:var(--panel); border:2px solid var(--gold); border-radius:99px; color:var(--gold); font-family:Georgia,serif; box-shadow:0 4px 18px rgba(0,0,0,.5); }
  .banner[hidden] { display:none; }
  #modal-expedition .modal-box { width:460px; max-width:calc(100vw - 32px); text-align:left; max-height:90vh; overflow:auto; }
  #modal-expedition h2 { margin:0 0 4px; }
  .target { margin:0 0 14px; color:var(--mute); font-family:Georgia,serif; }
  .field { display:block; margin-bottom:12px; font-size:13px; color:var(--mute); }
  .field input { display:block; width:100%; margin-top:4px; padding:7px 10px; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; color-scheme:dark; }
  .field input:focus { outline:none; border-color:var(--gold); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tagrow { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px; }
  .tag-btn { border-radius:99px; padding:4px 12px; font-size:13px; background:var(--bg); }
  .tag-btn.on { background:var(--gold); border-color:var(--gold); color:#0f172a; font-weight:600; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  .trip { padding:12px 14px; margin-bottom:10px; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:10px; }
  .trip h4 { margin:0; font-family:Georgia,serif; font-size:15px; }
  .trip .meta { color:var(--mute); font-size:13px; margin:2px 0 6px; }
  .badge { display:inline-block; margin:0 4px 4px 0; padding:1px 8px; font-size:11px; border-radius:99px; border:1px solid var(--line); color:var(--mute); }
  .badge.transit { border-color:#38bdf8; color:#38bdf8; }
  .badge.purpose { border-color:var(--gold); color:var(--gold); }
</style>
</head>
<body>
<header>
  <h1>Wanderlog</h1>
  <nav id="nav">
    <button data-p="parks">RPG Explorer</button>
    <button data-p="passport">Trip Ledger</button>
  </nav>
  <span class="spacer"></span>
  <button id="share">Copy share link</button>
  <button id="export">Export</button>
  <button id="import">Import</button>
  <input id="file" type="file" accept="application/json" hidden>
</header>

<section class="page" id="page-parks">
  <div id="leafletEl"></div>
  <div class="hud" id="hudParks"></div>
  <div class="banner" id="home-banner" hidden>Click your home county</div>
</section>

<section class="page scroll" id="page-passport"></section>

<div class="modal" id="modal-onboard">
  <div class="modal-box">
    <h2>Every journey begins at home. Establish your Citadel.</h2>
    <button class="btn-gold" id="btn-set-home">Set Home Base</button>
  </div>
</div>

<div class="modal" id="modal-expedition">
  <div class="modal-box">
    <h2>Log Expedition</h2>
    <p class="target" id="exp-target"></p>
    <label class="field">Trip name<input id="exp-name" type="text" maxlength="120" placeholder="Aspen Anniversary"></label>
    <div class="row2">
      <label class="field">Start date<input id="exp-start" type="date"></label>
      <label class="field">End date<input id="exp-end" type="date"></label>
    </div>
    <div class="field">How you traveled</div>
    <div class="tagrow">
      <button type="button" class="tag-btn" data-group="transit">AWD/Off-Road</button>
      <button type="button" class="tag-btn" data-group="transit">Ferry</button>
      <button type="button" class="tag-btn" data-group="transit">Flight</button>
      <button type="button" class="tag-btn" data-group="transit">Foot</button>
    </div>
    <div class="field">Why you went</div>
    <div class="tagrow">
      <button type="button" class="tag-btn" data-group="purpose">Photography</button>
      <button type="button" class="tag-btn" data-group="purpose">Solo</button>
      <button type="button" class="tag-btn" data-group="purpose">Friends/Family</button>
    </div>
    <div class="modal-actions">
      <button type="button" id="exp-cancel">Cancel</button>
      <button type="button" class="btn-gold" id="exp-save">Save Expedition</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
// ---------- Static data ----------
const BIOMES = {
  fo:['Temperate Forest','common'], gr:['Grassland','common'], co:['Coastline','common'], ur:['Urban','common'],
  de:['Desert','uncommon'], al:['Alpine','uncommon'], we:['Wetland','uncommon'], tr:['Tropical','uncommon'], ch:['Chaparral','uncommon'], is:['Island','uncommon'],
  rf:['Temperate Rainforest','rare'], gl:['Glacier','rare'], vo:['Volcanic / Geothermal','rare'], ca:['Cave System','rare'], tu:['Arctic Tundra','rare']
};
// [id, name, lat, lng, biomes, intl]
const PARKS = [
 ['acadia','Acadia',44.35,-68.21,'fo,co'],['samoa','American Samoa',-14.25,-170.68,'tr,is,co'],['arches','Arches',38.73,-109.59,'de'],
 ['badlands','Badlands',43.75,-102.5,'gr'],['bigbend','Big Bend',29.25,-103.25,'de'],['biscayne','Biscayne',25.65,-80.08,'co,is'],
 ['blackcanyon','Black Canyon of the Gunnison',38.57,-107.72,'al'],['bryce','Bryce Canyon',37.57,-112.18,'de,al'],['canyonlands','Canyonlands',38.2,-109.93,'de'],
 ['capitolreef','Capitol Reef',38.2,-111.17,'de'],['carlsbad','Carlsbad Caverns',32.17,-104.44,'ca,de'],['channel','Channel Islands',34.01,-119.42,'is,ch,co'],
 ['congaree','Congaree',33.78,-80.78,'we,fo'],['crater','Crater Lake',42.94,-122.1,'vo,al'],['cuyahoga','Cuyahoga Valley',41.24,-81.55,'fo'],
 ['deathvalley','Death Valley',36.24,-116.82,'de'],['denali','Denali',63.33,-150.5,'tu,gl,al'],['drytortugas','Dry Tortugas',24.63,-82.87,'is,co'],
 ['everglades','Everglades',25.32,-80.93,'we,tr'],['gatesarctic','Gates of the Arctic',67.78,-153.3,'tu'],['gatewayarch','Gateway Arch',38.62,-90.19,'ur'],
 ['glacier','Glacier',48.76,-113.79,'al,gl,fo'],['glacierbay','Glacier Bay',58.5,-137,'gl,co,rf'],['grandcanyon','Grand Canyon',36.06,-112.14,'de,fo'],
 ['grandteton','Grand Teton',43.79,-110.68,'al,fo'],['greatbasin','Great Basin',38.98,-114.3,'de,al'],['greatsand','Great Sand Dunes',37.73,-105.51,'de,gr'],
 ['smokies','Great Smoky Mountains',35.61,-83.49,'fo'],['guadalupe','Guadalupe Mountains',31.92,-104.52,'de'],['haleakala','Haleakalā',20.72,-156.17,'vo,is,tr'],
 ['hawaiivolc','Hawaiʻi Volcanoes',19.38,-155.2,'vo,is,tr'],['hotsprings','Hot Springs',34.51,-93.05,'fo,vo'],['indianadunes','Indiana Dunes',41.65,-87.05,'co,fo'],
 ['isleroyale','Isle Royale',48.1,-88.55,'is,fo'],['joshuatree','Joshua Tree',33.79,-115.9,'de'],['katmai','Katmai',58.5,-155,'vo,tu,co'],
 ['kenai','Kenai Fjords',59.92,-149.65,'gl,co,rf'],['kingscanyon','Kings Canyon',36.89,-118.55,'al,fo'],['kobuk','Kobuk Valley',67.55,-159.28,'tu,de'],
 ['lakeclark','Lake Clark',60.97,-153.42,'vo,tu'],['lassen','Lassen Volcanic',40.49,-121.51,'vo,al'],['mammoth','Mammoth Cave',37.19,-86.1,'ca,fo'],
 ['mesaverde','Mesa Verde',37.18,-108.49,'de,ch'],['rainier','Mount Rainier',46.85,-121.75,'gl,al,fo'],['newriver','New River Gorge',37.96,-81.08,'fo'],
 ['northcascades','North Cascades',48.7,-121.2,'gl,al,rf'],['olympic','Olympic',47.97,-123.5,'rf,al,co'],['petrified','Petrified Forest',34.91,-109.81,'de'],
 ['pinnacles','Pinnacles',36.48,-121.16,'ch'],['redwood','Redwood',41.21,-124,'rf,co'],['rockymtn','Rocky Mountain',40.34,-105.68,'al,fo'],
 ['saguaro','Saguaro',32.25,-110.5,'de'],['sequoia','Sequoia',36.49,-118.57,'al,fo'],['shenandoah','Shenandoah',38.53,-78.35,'fo'],
 ['roosevelt','Theodore Roosevelt',46.97,-103.45,'gr'],['virginislands','Virgin Islands',18.34,-64.74,'tr,is,co'],['voyageurs','Voyageurs',48.5,-92.88,'we,fo'],
 ['whitesands','White Sands',32.78,-106.17,'de'],['windcave','Wind Cave',43.57,-103.48,'ca,gr'],['wrangell','Wrangell–St. Elias',61,-142,'gl,al,tu'],
 ['yellowstone','Yellowstone',44.6,-110.5,'vo,al,fo'],['yosemite','Yosemite',37.85,-119.57,'al,fo'],['zion','Zion',37.3,-113.05,'de'],
 // International
 ['banff','Banff (Canada)',51.5,-116.15,'al,gl,fo',1],['torres','Torres del Paine (Chile)',-51,-73,'al,gl,gr',1],['serengeti','Serengeti (Tanzania)',-2.33,34.83,'gr',1],
 ['galapagos','Galápagos (Ecuador)',-0.67,-90.55,'is,vo,co',1],['iguazu','Iguazú Falls (Argentina/Brazil)',-25.69,-54.44,'tr',1],['fiordland','Fiordland (New Zealand)',-45.4,167.7,'rf,gl,co',1],
 ['plitvice','Plitvice Lakes (Croatia)',44.88,15.62,'fo,we',1],['thingvellir','Þingvellir / Iceland',64.26,-21.12,'vo,gl,tu',1],['halong','Hạ Long Bay (Vietnam)',20.91,107.18,'is,co,tr',1],
 ['kruger','Kruger (South Africa)',-23.99,31.55,'gr',1],['uluru','Uluru-Kata Tjuṯa (Australia)',-25.34,131.04,'de',1],['jungfrau','Swiss Alps / Jungfrau',46.54,7.96,'al,gl',1]
].map(a => ({id:a[0], name:a[1], lat:a[2], lng:a[3], biomes:a[4].split(','), intl:!!a[5]}));

const QUESTS = [
  ['The Mighty 5','Utah\'s five national parks',['zion','bryce','capitolreef','arches','canyonlands']],
  ['Cascade Volcanoes','Fire and ice in the Pacific Northwest',['rainier','crater','lassen']],
  ['Alaska Wild','The last frontier',['denali','glacierbay','kenai','katmai','wrangell']],
  ['Island Volcanoes','Hawaii\'s two volcano parks',['haleakala','hawaiivolc']],
  ['Underground','Cave systems of the US',['carlsbad','mammoth','windcave']],
  ['Desert Southwest','Heat, rock and saguaros',['deathvalley','joshuatree','saguaro','grandcanyon','whitesands','bigbend']],
  ['Giants','The big trees',['redwood','sequoia','kingscanyon','yosemite']]
];
const US_ST = {acadia:['Maine'],arches:['Utah'],badlands:['South Dakota'],bigbend:['Texas'],biscayne:['Florida'],blackcanyon:['Colorado'],bryce:['Utah'],canyonlands:['Utah'],capitolreef:['Utah'],carlsbad:['New Mexico'],channel:['California'],congaree:['South Carolina'],crater:['Oregon'],cuyahoga:['Ohio'],deathvalley:['California','Nevada'],denali:['Alaska'],drytortugas:['Florida'],everglades:['Florida'],gatesarctic:['Alaska'],gatewayarch:['Missouri'],glacier:['Montana'],glacierbay:['Alaska'],grandcanyon:['Arizona'],grandteton:['Wyoming'],greatbasin:['Nevada'],greatsand:['Colorado'],smokies:['Tennessee','North Carolina'],guadalupe:['Texas'],haleakala:['Hawaii'],hawaiivolc:['Hawaii'],hotsprings:['Arkansas'],indianadunes:['Indiana'],isleroyale:['Michigan'],joshuatree:['California'],katmai:['Alaska'],kenai:['Alaska'],kingscanyon:['California'],kobuk:['Alaska'],lakeclark:['Alaska'],lassen:['California'],mammoth:['Kentucky'],mesaverde:['Colorado'],rainier:['Washington'],newriver:['West Virginia'],northcascades:['Washington'],olympic:['Washington'],petrified:['Arizona'],pinnacles:['California'],redwood:['California'],rockymtn:['Colorado'],saguaro:['Arizona'],sequoia:['California'],shenandoah:['Virginia'],roosevelt:['North Dakota'],voyageurs:['Minnesota'],whitesands:['New Mexico'],windcave:['South Dakota'],wrangell:['Alaska'],yellowstone:['Wyoming','Montana','Idaho'],yosemite:['California'],zion:['Utah']};
const INTL_C = {banff:['Canada'],torres:['Chile'],serengeti:['Tanzania'],galapagos:['Ecuador'],iguazu:['Argentina','Brazil'],fiordland:['New Zealand'],plitvice:['Croatia'],thingvellir:['Iceland'],halong:['Vietnam'],kruger:['South Africa'],uluru:['Australia'],jungfrau:['Switzerland']};
const WORLD_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json';
const US_URL = 'https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json';
const COUNTIES_URL = 'https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json';

// ---------- State ----------
// Canonical state (persisted). S below is a derived legacy view so the existing UI keeps working.
const TIERS = ['wishlist', 'transited', 'visited', 'lived'];
const TO_LEGACY = {wishlist:'w', visited:'v', lived:'v'};   // 'transited' is not shown by the current UI
const FROM_LEGACY = {w:'wishlist', v:'visited'};
const STORE_KEY = 'wanderlog_v2';
const LOC_RE = /^[cpsk]:/;   // k: = county (FIPS)
let state = {version:2, homeBase:null, expeditions:[], locations:{}};
let S = {};               // legacy view: key -> 'v' | 'w'
let viewOnly = false;
const NEXT = {undefined:'v', v:'w', w:undefined};
const COL = {v:'#22c55e', w:'#f59e0b'};
const FOG = '#05070d';
const FOG_STROKE = '#1a2238';

// Visiting a park implies its state(s) and country
let implied = new Set();
function computeImplied() {
  implied = new Set();
  PARKS.filter(p => S['p:'+p.id] === 'v').forEach(p => {
    if (p.intl) INTL_C[p.id].forEach(c => implied.add('c:'+c));
    else { implied.add('c:United States of America'); (US_ST[p.id] || []).forEach(s => implied.add('s:'+s)); }
  });
}
const eff = k => implied.has(k) ? 'v' : S[k];

const str = (v, max = 200) => typeof v === 'string' ? v.slice(0, max) : '';
const strList = v => Array.isArray(v) ? v.filter(x => typeof x === 'string').map(x => x.slice(0, 80)) : [];
const locList = v => strList(v).filter(id => LOC_RE.test(id));

function normalizeExpedition(t, i = 0) {
  if (!t || typeof t !== 'object') return null;
  return {
    id: str(t.id, 60) || 'trip-' + Date.now().toString(36) + i,
    name: str(t.name), startDate: str(t.startDate, 10), endDate: str(t.endDate, 10),
    transitTags: strList(t.transitTags), purposeTags: strList(t.purposeTags), locations: locList(t.locations)
  };
}

function normalizeHomeBase(h) {
  if (!h || typeof h !== 'object' || !isFinite(h.lat) || !isFinite(h.lng)) return null;
  return {lat:+h.lat, lng:+h.lng, name:str(h.name, 100), countyId:str(h.countyId, 10)};
}

// Accepts v2 state or the legacy flat {key:'v'|'w'} map; returns a clean v2 state.
function normalizeState(raw) {
  const out = {version:2, homeBase:null, expeditions:[], locations:{}};
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  const isV2 = raw.locations && typeof raw.locations === 'object';
  const locs = isV2 ? raw.locations : raw;
  for (const [k, v] of Object.entries(locs)) {
    if (!LOC_RE.test(k)) continue;
    const tier = isV2 ? v : FROM_LEGACY[v];
    if (TIERS.includes(tier)) out.locations[k] = tier;
  }
  if (isV2) {
    out.homeBase = normalizeHomeBase(raw.homeBase);
    out.expeditions = (Array.isArray(raw.expeditions) ? raw.expeditions : []).map(normalizeExpedition).filter(Boolean);
  }
  return out;
}

function syncLegacy() {
  S = {};
  for (const [k, t] of Object.entries(state.locations)) if (TO_LEGACY[t]) S[k] = TO_LEGACY[t];
}

(function loadState() {
  const d = new URLSearchParams(location.search).get('d');
  if (d) {
    try { state = normalizeState(JSON.parse(decodeURIComponent(atob(d)))); viewOnly = true; syncLegacy(); return; } catch (e) {}
  }
  try {
    const v2 = localStorage.getItem(STORE_KEY);
    // First run after upgrade: migrate the old flat map once.
    state = normalizeState(JSON.parse(v2 || localStorage.getItem('wanderlog') || '{}'));
    if (!v2) save();
  } catch (e) { state = normalizeState(null); }
  syncLegacy();
})();
function save() { if (!viewOnly) localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

function setHomeBase(h) { state.homeBase = normalizeHomeBase(h); save(); renderAll(); }

function setStatus(key, st) {
  if (!LOC_RE.test(key)) return;
  if (FROM_LEGACY[st]) state.locations[key] = FROM_LEGACY[st]; else delete state.locations[key];
  syncLegacy(); save(); renderAll();
}

// Logs a trip and promotes its locations to at least 'visited' (never downgrades 'lived').
function addExpedition(trip) {
  const t = normalizeExpedition(trip, state.expeditions.length);
  if (!t) return null;
  while (state.expeditions.some(e => e.id === t.id)) t.id += '-' + Math.random().toString(36).slice(2, 5);
  state.expeditions.push(t);
  t.locations.forEach(id => { if (TIERS.indexOf(state.locations[id]) < TIERS.indexOf('visited')) state.locations[id] = 'visited'; });
  syncLegacy(); save(); renderAll();
  return t;
}
function cycle(key) { setStatus(key, NEXT[S[key]]); }
const count = (prefix, st='v') => [...new Set([...Object.keys(S), ...implied])].filter(k => k.startsWith(prefix) && eff(k) === st).length;
const parkVisited = p => S['p:'+p.id] === 'v';

// ---------- Derived stats ----------
let worldFeatures = [], usFeatures = [], countyFeatures = [];
function exploredPct() {
  const land = worldFeatures.filter(f => f.properties.name !== 'Antarctica');
  const total = d3.sum(land, f => f.area);
  const usa = land.find(f => f.properties.name === 'United States of America');
  const usTotal = d3.sum(usFeatures, f => f.area);
  const usSeen = d3.sum(usFeatures.filter(f => eff('s:'+f.properties.name) === 'v'), f => f.area);
  const usShare = S['c:United States of America'] === 'v' ? 1 : usSeen / usTotal;
  let seen = 0;
  land.forEach(f => { if (f !== usa && eff('c:'+f.properties.name) === 'v') seen += f.area; });
  if (usa) seen += usa.area * usShare;
  return seen / total * 100;
}

function stats() {
  const vp = PARKS.filter(parkVisited);
  const biomes = new Set(vp.flatMap(p => p.biomes));
  const rareAll = Object.keys(BIOMES).filter(b => BIOMES[b][1] === 'rare');
  const unlockedRare = rareAll.filter(b => biomes.has(b));
  const countries = count('c:'), states = count('s:');
  const usParks = vp.filter(p => !p.intl).length;
  let xp = countries*10 + states*5 + vp.length*15;
  biomes.forEach(b => xp += {common:10, uncommon:30, rare:60}[BIOMES[b][1]]);
  const level = Math.floor(Math.sqrt(xp/20)) + 1;
  return {vp, biomes, rareAll, unlockedRare, countries, states, usParks, anyParks:vp.length, xp, level, explored:exploredPct()};
}

function achievements(st) {
  const tiers = (name, desc, val, goals) => goals.map(g => ({name:`${name} ${g}`, desc:desc.replace('#', g), val, goal:g}));
  const nUS = PARKS.filter(p => !p.intl).length;
  return [
    ...tiers('Country Counter','Visit # countries', st.countries, [1,5,10,25,50,100]),
    ...tiers('State Hopper','Visit # US states', st.states, [5,10,25,50]),
    ...tiers('Park Ranger','Visit # US national parks', st.usParks, [1,5,10,25,nUS]),
    ...tiers('Global Ranger','Visit # national parks worldwide', st.anyParks, [5,15,30,75]),
    ...tiers('Biome Collector','Unlock # biomes', st.biomes.size, [3,6,10,Object.keys(BIOMES).length]),
    ...tiers('Rare Finder','Unlock # rare biomes', st.unlockedRare.length, [1,3,st.rareAll.length])
  ];
}

function travelerClass(st) {
  const has = (p, bs) => p.biomes.some(b => bs.includes(b));
  const v = st.vp;
  const axes = {
    Nature: Math.min(1, v.length/30),
    Adventure: Math.min(1, v.filter(p => has(p,['al','gl','vo','ca'])).length/12),
    Remoteness: Math.min(1, v.filter(p => has(p,['tu','is','gl'])).length/8),
    Worldly: Math.min(1, st.countries/25),
    Roadtrip: Math.min(1, st.states/40)
  };
  const best = Object.entries(axes).sort((a,b) => b[1]-a[1])[0];
  const cls = best[1] === 0 ? 'Fresh Recruit' : {Nature:'Park Completionist', Adventure:'Alpine Ranger', Remoteness:'Biome Hunter', Worldly:'Globetrotter', Roadtrip:'Road Warrior'}[best[0]];
  return {axes, cls};
}

// ---------- Routing ----------
const pages = ['parks','passport'];
function show(p) {
  if (!pages.includes(p)) p = 'parks';
  pages.forEach(x => document.getElementById('page-'+x).classList.toggle('active', x === p));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.p === p));
  if (p === 'parks') { initLeaflet(); setTimeout(() => lmap.invalidateSize(), 50); }
  if (p === 'passport') renderPassport();
  history.replaceState(null, '', location.search + '#' + p);
}
document.getElementById('nav').onclick = e => { if (e.target.dataset.p) show(e.target.dataset.p); };

// ---------- Leaflet parks map ----------
let lmap, markers = {}, regionLayers = [];
const CLEARED_TIERS = ['visited', 'lived', 'transited'];
let stateByFips = new Map(), countyIndex = new Map();

// Non-US countries: visited clears the fog, wishlist tints amber.
function regionStyle(pre) {
  return f => {
    const s = eff(pre + f.properties.name);
    const base = {fillColor: FOG, color: '#1f2a48', weight: .6};
    return s === 'v' ? {...base, fillOpacity: 0} : s === 'w' ? {...base, fillColor: COL.w, fillOpacity: .35} : {...base, fillOpacity: .95};
  };
}

// A county is cleared if logged itself, or its state is visited (bridges existing state data).
function countyCleared(f) {
  if (CLEARED_TIERS.includes(state.locations['k:' + f.id])) return true;
  return eff('s:' + stateByFips.get(String(f.id).slice(0, 2))) === 'v';
}
function countyStyle(f) {
  return countyCleared(f)
    ? {fillColor: FOG, fillOpacity: 0, color: '#3b4a72', weight: .4}
    : {fillColor: FOG, fillOpacity: .95, color: '#1f2a48', weight: .3};
}

function initLeaflet() {
  if (lmap) return;
  stateByFips = new Map(usFeatures.map(f => [f.id, f.properties.name]));
  lmap = L.map('leafletEl', {worldCopyJump:true, preferCanvas:true, minZoom:2, zoomSnap:.5}).setView([39, -98], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(lmap);
  const fc = features => ({type:'FeatureCollection', features});
  const world = L.geoJSON(fc(worldFeatures.filter(f => f.properties.name !== 'United States of America')), {
    style: regionStyle('c:'),
    onEachFeature: (f, l) => { l.bindTooltip(f.properties.name, {sticky:true}); l.on('click', () => { if (!viewOnly && !isSettingHome) cycle('c:' + f.properties.name); }); }
  }).addTo(lmap);
  regionLayers.push([world, regionStyle('c:')]);
  const counties = L.geoJSON(fc(countyFeatures), {
    style: countyStyle,
    onEachFeature: (f, l) => l.on('click', () => {
      if (isSettingHome) return setHomeCounty(f);
      if (!viewOnly) openExpedition(f);
    })
  }).addTo(lmap);
  regionLayers.push([counties, countyStyle]);
  PARKS.forEach(p => {
    const m = L.circleMarker([p.lat, p.lng], {radius:7, weight:2, color:'#e2e8f0', fillOpacity:1, bubblingMouseEvents:false}).addTo(lmap);
    m.bindPopup(() => {
      const btn = (s, t) => viewOnly ? '' : `<button onclick="setStatus('p:${p.id}', ${s ? `'${s}'` : 'null'})">${t}</button>`;
      return `<b>${p.name}</b><br>${p.biomes.map(b => `<span class="tag ${BIOMES[b][1]}">${BIOMES[b][0]}</span>`).join(' ')}
        <div class="popbtns">${btn('v','Visited')}${btn('w','Wishlist')}${btn(null,'Clear')}</div>`;
    });
    markers[p.id] = m;
  });
  refreshLeaflet();
}
// ---------- Citadel onboarding ----------
let isSettingHome = false;
const modalOnboard = document.getElementById('modal-onboard');
const homeBanner = document.getElementById('home-banner');
document.getElementById('btn-set-home').onclick = () => {
  modalOnboard.classList.remove('open');
  isSettingHome = true;
  homeBanner.hidden = false;
  show('parks');
};
function setHomeCounty(f) {
  const [lng, lat] = d3.geoCentroid(f);
  const st = stateByFips.get(String(f.id).slice(0, 2));
  state.locations['k:' + f.id] = 'lived';
  isSettingHome = false;
  homeBanner.hidden = true;
  setHomeBase({lat, lng, name: st ? `${f.properties.name}, ${st}` : f.properties.name, countyId: String(f.id)});
}

// ---------- Expedition logger ----------
let expTarget = null;
const modalExp = document.getElementById('modal-expedition');
function openExpedition(f) {
  const st = stateByFips.get(String(f.id).slice(0, 2));
  expTarget = {id: String(f.id), name: st ? `${f.properties.name}, ${st}` : f.properties.name};
  document.getElementById('exp-target').textContent = 'Target: ' + expTarget.name;
  modalExp.classList.add('open');
  document.getElementById('exp-name').focus();
}
function closeExpedition() {
  modalExp.classList.remove('open');
  modalExp.querySelectorAll('input').forEach(i => i.value = '');
  modalExp.querySelectorAll('.tag-btn.on').forEach(b => b.classList.remove('on'));
  expTarget = null;
}
function saveExpedition() {
  if (!expTarget) return;
  const val = id => document.getElementById(id).value;
  let start = val('exp-start'), end = val('exp-end');
  if (start && end && end < start) [start, end] = [end, start];
  const tags = g => [...modalExp.querySelectorAll(`.tag-btn[data-group="${g}"].on`)].map(b => b.textContent.trim());
  addExpedition({
    name: val('exp-name').trim() || expTarget.name,
    startDate: start, endDate: end,
    transitTags: tags('transit'), purposeTags: tags('purpose'),
    locations: ['k:' + expTarget.id]
  });
  closeExpedition();
}
modalExp.querySelectorAll('.tag-btn').forEach(b => b.onclick = () => b.classList.toggle('on'));
document.getElementById('exp-save').onclick = saveExpedition;
document.getElementById('exp-cancel').onclick = closeExpedition;

function refreshLeaflet() {
  if (!lmap) return;
  regionLayers.forEach(([lyr, style]) => lyr.setStyle(style));
  PARKS.forEach(p => markers[p.id].setStyle({fillColor: eff('p:'+p.id) ? COL[eff('p:'+p.id)] : '#64748b'}).bringToFront());
}

// ---------- Passport ----------
function bar(v, g) { return `<div class="bar"><i style="width:${Math.min(100, v/g*100)}%"></i></div>`; }
function radar(axes) {
  const names = Object.keys(axes), n = names.length, R = 90, C = 120;
  const pt = (i, r) => [C + Math.sin(2*Math.PI*i/n) * r, C - Math.cos(2*Math.PI*i/n) * r];
  const ring = k => names.map((_, i) => pt(i, R*k).join(',')).join(' ');
  const shape = names.map((k, i) => pt(i, R * Math.max(0.05, axes[k])).join(',')).join(' ');
  const labels = names.map((k, i) => { const [x, y] = pt(i, R + 18); return `<text x="${x}" y="${y}" fill="#8b94b0" font-size="11" text-anchor="middle" dominant-baseline="middle">${k}</text>`; }).join('');
  return `<svg viewBox="0 0 240 240" width="100%">${[.33,.66,1].map(k => `<polygon points="${ring(k)}" fill="none" stroke="#232c47"/>`).join('')}
    <polygon points="${shape}" fill="rgba(59,91,219,.45)" stroke="#6ea8ff" stroke-width="2"/>${labels}</svg>`;
}
function renderPassport() {
  const st = stats(), tc = travelerClass(st), ach = achievements(st);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const trips = state.expeditions.map((t, i) => ({t, i}))
    .sort((a, b) => (b.t.endDate || b.t.startDate).localeCompare(a.t.endDate || a.t.startDate) || b.i - a.i).map(x => x.t);
  const tripCards = trips.map(t => {
    const dates = t.startDate && t.endDate && t.startDate !== t.endDate ? `${t.startDate} → ${t.endDate}` : (t.startDate || t.endDate || 'Date unknown');
    const places = t.locations.map(id => id.startsWith('k:') ? countyIndex.get(id.slice(2)) : id.slice(2)).filter(Boolean).join(', ');
    const badges = t.transitTags.map(x => `<span class="badge transit">${esc(x)}</span>`).join('') + t.purposeTags.map(x => `<span class="badge purpose">${esc(x)}</span>`).join('');
    return `<div class="trip"><h4>${esc(t.name)}</h4><div class="meta">${esc(dates)}${places ? ' · ' + esc(places) : ''}</div>${badges}</div>`;
  }).join('') || '<p style="color:var(--mute)">No expeditions logged yet. Click a county on the map to log one.</p>';
  const biomeCards = Object.entries(BIOMES).sort((a, b) => ['common','uncommon','rare'].indexOf(a[1][1]) - ['common','uncommon','rare'].indexOf(b[1][1])).map(([id, [name, rar]]) => {
    const on = st.biomes.has(id);
    return `<div class="card ${on ? 'done' : 'locked'}"><h4>${name}</h4><span class="tag ${rar}">${rar}</span>
      <p style="margin-top:8px">${on ? 'Unlocked' : 'Visit a park with this biome'}</p></div>`;
  }).join('');
  const questCards = QUESTS.map(([name, desc, ids]) => {
    const v = ids.filter(id => S['p:'+id] === 'v').length;
    return `<div class="card ${v === ids.length ? 'done' : ''}"><h4>${name}</h4><p>${desc}</p>${bar(v, ids.length)}
      <p style="margin:6px 0 0">${v} / ${ids.length}: ${ids.map(id => PARKS.find(p => p.id === id).name).join(', ')}</p></div>`;
  }).join('');
  const achCards = ach.map(a => `<div class="card ${a.val >= a.goal ? 'done' : ''}"><h4>${a.name}</h4><p>${a.desc}</p>${bar(a.val, a.goal)}
      <p style="margin:6px 0 0">${Math.min(a.val, a.goal)} / ${a.goal}</p></div>`).join('');
  document.getElementById('page-passport').innerHTML = `
    <div class="passport">
      <div class="card"><div class="big">Lv ${st.level} · ${tc.cls}</div><p>${st.xp} XP${viewOnly ? ' · viewing a shared passport' : ''}</p>${radar(tc.axes)}</div>
      <div class="card">
        <div class="grid">
          <div><div class="big">${st.explored.toFixed(1)}%</div><p>World explored (by land area)</p></div>
          <div><div class="big">${st.countries}</div><p>Countries</p></div>
          <div><div class="big">${st.states}<small style="font-size:14px;color:var(--mute)"> / 50</small></div><p>US states</p></div>
          <div><div class="big">${st.usParks}<small style="font-size:14px;color:var(--mute)"> / ${PARKS.filter(p => !p.intl).length}</small></div><p>US national parks</p></div>
          <div><div class="big">${st.anyParks}</div><p>Parks worldwide</p></div>
          <div><div class="big">${st.biomes.size}<small style="font-size:14px;color:var(--mute)"> / ${Object.keys(BIOMES).length}</small></div><p>Biomes</p></div>
          <div><div class="big">${st.unlockedRare.length}<small style="font-size:14px;color:var(--mute)"> / ${st.rareAll.length}</small></div><p>Rare biomes</p></div>
        </div>
      </div>
    </div>
    <h2>Biome Pokédex</h2><div class="grid">${biomeCards}</div>
    <h2>Questlines</h2><div class="grid">${questCards}</div>
    <h2>Expedition History</h2>${tripCards}
    <h2>Achievements</h2><div class="grid">${achCards}</div>`;
}

// ---------- HUDs ----------
function renderHud() {
  const st = stats();
  document.getElementById('hudParks').innerHTML = `<h3>Lv ${st.level} · ${travelerClass(st).cls}</h3>
    <div class="row">World explored <b>${st.explored.toFixed(1)}%</b></div>
    <div class="row">Countries <b>${st.countries}</b></div><div class="row">US states <b>${st.states} / 50</b></div>
    <div class="row">Biomes <b>${st.biomes.size} / ${Object.keys(BIOMES).length}</b></div>
    ${viewOnly ? '<div class="row" style="margin-top:6px;color:var(--wish)">Read-only shared view</div>' : ''}
    <div class="row">US visited <b>${st.usParks} / ${PARKS.filter(p => !p.intl).length}</b></div>
    <div class="row">Wishlist <b>${count('p:','w')}</b></div>
    <div class="row" style="margin-top:6px">Click a pin to update</div>`;
}

function renderAll() { computeImplied(); renderHud(); refreshLeaflet(); if (document.getElementById('page-passport').classList.contains('active')) renderPassport(); }

// ---------- Share / export / import ----------
document.getElementById('share').onclick = async e => {
  const url = location.origin + location.pathname + '?d=' + btoa(encodeURIComponent(JSON.stringify(state))) + '#passport';
  try { await navigator.clipboard.writeText(url); e.target.textContent = 'Copied!'; } catch (_) { prompt('Copy this link:', url); }
  setTimeout(() => e.target.textContent = 'Copy share link', 1500);
};
document.getElementById('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}));
  a.download = 'wanderlog.json'; a.click();
};
document.getElementById('import').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const raw = JSON.parse(await f.text());
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw 0;
    state = normalizeState(raw);
    syncLegacy(); viewOnly = false; save(); renderAll();
  } catch (_) { alert('Invalid file'); }
  e.target.value = '';
};

// ---------- Boot ----------
Promise.all([WORLD_URL, US_URL, COUNTIES_URL].map(url => fetch(url).then(r => r.json()))).then(([w, u, c]) => {
  worldFeatures = topojson.feature(w, w.objects.countries).features;
  worldFeatures.forEach(f => f.area = d3.geoArea(f));
  usFeatures = topojson.feature(u, u.objects.states).features.filter(f => +f.id <= 56 && f.id !== '11');
  usFeatures.forEach(f => f.area = d3.geoArea(f));
  countyFeatures = topojson.feature(c, c.objects.counties).features;
  countyIndex = new Map(countyFeatures.map(f => [String(f.id), f.properties.name]));
  computeImplied();
  renderAll();
  show(location.hash.slice(1));
  if (!state.homeBase && !viewOnly) modalOnboard.classList.add('open');
});
</script>
