name: Import NPS catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install data importer dependencies
        working-directory: cartovella
        run: npm ci
      - name: Fetch complete official catalog
        run: node cartovella/import-nps.mjs
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      - name: Download licensed RESOLVE source
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/Ecoregions2017.zip" https://storage.googleapis.com/teow2016/Ecoregions2017.zip
          unzip -q "$RUNNER_TEMP/Ecoregions2017.zip" -d "$RUNNER_TEMP/ecoregions"
      - name: Refresh terrestrial biome mappings
        run: node cartovella/import-ecoregions.mjs "$RUNNER_TEMP/ecoregions/Ecoregions2017.shp"
      - name: Refresh compact park boundaries and coordinate geography
        run: node cartovella/import-geography.mjs "$RUNNER_TEMP/ecoregions/Ecoregions2017.shp"
      - name: Test generated catalogs and game integration
        working-directory: cartovella
        run: npm test
      - uses: actions/upload-artifact@v6
        with:
          name: nps-catalog
          path: |
            cartovella/nps-parks.json
            cartovella/ecoregion-mapping.json
            cartovella/nps-boundaries.topojson
            cartovella/ecoregions.topojson
            cartovella/mangroves.topojson
          if-no-files-found: error
