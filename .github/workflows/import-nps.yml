name: Import NPS catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test importer
        run: node wanderlog/nps-catalog.test.mjs
      - name: Fetch complete official catalog
        run: node wanderlog/import-nps.mjs
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nps-catalog
          path: wanderlog/nps-parks.json
          if-no-files-found: error
