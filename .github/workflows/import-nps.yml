name: Import NPS catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test importer
        run: node Wanderlog/nps-catalog.test.mjs
      - name: Fetch complete official catalog
        run: node Wanderlog/import-nps.mjs
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: nps-catalog
          path: Wanderlog/nps-parks.json
          if-no-files-found: error
