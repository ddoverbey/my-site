<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devon Overbey | Music</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-zinc-800">

  <!-- Container -->
  <main class="w-full max-w-sm flex flex-col items-center text-center space-y-6">

    <!-- Profile Header -->
    <header class="flex flex-col items-center space-y-3">
      <div class="w-24 h-24 rounded-full bg-zinc-800 ring-2 ring-zinc-700 overflow-hidden shadow-lg">
        <!-- Replace src with your profile photo or album art path -->
        <img src="/assets/profile.jpg" alt="Devon Overbey" class="w-full h-full object-cover" onerror="this.style.display='none'" />
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">Devon Overbey</h1>
        <p class="text-sm text-zinc-400 mt-0.5">Indie Pop • Chamber Pop • Production</p>
      </div>
    </header>

    <!-- Featured Release Embed / Callout -->
    <section class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-4 shadow-sm">
      <span class="text-xs uppercase tracking-widest text-emerald-400 font-semibold block mb-1">Latest Release</span>
      <p class="font-medium text-zinc-200 text-sm">"Echos of Autumn"</p>
      <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer" 
         class="inline-block mt-3 px-4 py-1.5 text-xs font-medium rounded-full bg-emerald-500 text-black hover:bg-emerald-400 transition-colors">
        Listen Now
      </a>
    </section>

    <!-- Links List -->
    <section class="w-full space-y-3">
      
      <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer"
         class="flex items-center justify-center w-full py-3.5 px-4 rounded-xl bg-zinc-900 border border-zinc-800 text-sm font-medium hover:border-zinc-600 hover:bg-zinc-800/80 active:scale-[0.99] transition-all">
        Spotify
      </a>

      <a href="https://music.apple.com" target="_blank" rel="noopener noreferrer"
         class="flex items-center justify-center w-full py-3.5 px-4 rounded-xl bg-zinc-900 border border-zinc-800 text-sm font-medium hover:border-zinc-600 hover:bg-zinc-800/80 active:scale-[0.99] transition-all">
        Apple Music
      </a>

      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer"
         class="flex items-center justify-center w-full py-3.5 px-4 rounded-xl bg-zinc-900 border border-zinc-800 text-sm font-medium hover:border-zinc-600 hover:bg-zinc-800/80 active:scale-[0.99] transition-all">
        YouTube
      </a>

      <a href="/" 
         class="flex items-center justify-center w-full py-3.5 px-4 rounded-xl bg-zinc-900/50 border border-zinc-800/60 text-sm font-medium text-zinc-300 hover:border-zinc-600 hover:text-white transition-all">
        Main Website & Hub
      </a>

    </section>

    <!-- Social / Secondary Footer -->
    <footer class="pt-4 text-xs text-zinc-500">
      <p>© 2026 Devon Overbey</p>
    </footer>

  </main>

</body>
</html>
